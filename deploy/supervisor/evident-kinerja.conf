; /etc/supervisor/conf.d/evident-kinerja.conf
; sudo supervisorctl reread && sudo supervisorctl update

[program:evident-horizon]
process_name=%(program_name)s
command=php /var/www/evident-kinerja/artisan horizon
directory=/var/www/evident-kinerja
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/evident/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
; Horizon menerima SIGTERM dan menunggu job berjalan selesai. Harus >= timeout job upload (900 dtk)
; agar upload besar tidak terpotong saat restart/deploy.
stopsignal=TERM
stopwaitsecs=960

[program:evident-scheduler]
process_name=%(program_name)s
command=php /var/www/evident-kinerja/artisan schedule:work
directory=/var/www/evident-kinerja
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/evident/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=30
