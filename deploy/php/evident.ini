; /etc/php/8.3/fpm/conf.d/90-evident.ini
; Batas upload: samakan dengan EVIDENT_MAX_UPLOAD_MB (50) dan client_max_body_size nginx (55m).
upload_max_filesize = 50M
post_max_size       = 55M
max_execution_time  = 120
memory_limit        = 256M
expose_php          = Off

opcache.enable                  = 1
opcache.validate_timestamps     = 0   ; wajib reload php-fpm setiap deploy (deploy.sh sudah melakukannya)
opcache.memory_consumption      = 192
opcache.max_accelerated_files   = 20000
