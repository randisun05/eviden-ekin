; /etc/php/8.3/fpm/conf.d/90-evident.ini
; Batas upload: per berkas EVIDENT_MAX_UPLOAD_MB (50); satu bukti EVIDENT_MAX_TOTAL_MB (90) dan EVIDENT_MAX_FILES (20).
; post_max_size > total + overhead multipart; client_max_body_size nginx samakan (95m). Cloudflare membatasi body 100 MB.
upload_max_filesize = 50M
post_max_size       = 95M
max_file_uploads    = 20
max_execution_time  = 120
memory_limit        = 256M
expose_php          = Off

opcache.enable                  = 1
opcache.validate_timestamps     = 0   ; wajib reload php-fpm setiap deploy (deploy.sh sudah melakukannya)
opcache.memory_consumption      = 192
opcache.max_accelerated_files   = 20000
