# /etc/nginx/sites-available/evident-kinerja  (symlink ke sites-enabled)
#
# Nginx HANYA mendengarkan di loopback: satu-satunya jalur masuk adalah Cloudflare Tunnel
# (cloudflared -> 127.0.0.1:8080). Karena itu header CF-Connecting-IP aman dipercaya.

# Laravel perlu tahu request asli HTTPS (Cloudflare -> cloudflared -> nginx berupa HTTP).
map $http_x_forwarded_proto $fwd_https {
    default off;
    https   on;
}

server {
    listen 127.0.0.1:8080;
    server_name evident.domain.com;

    root /var/www/evident-kinerja/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # IP pengunjung sebenarnya -> REMOTE_ADDR di PHP. Wajib: rate limit PIN memakai IP ini.
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    # Harus > EVIDENT_MAX_UPLOAD_MB (50) + overhead multipart. Samakan dengan php/evident.ini.
    # Catatan: paket gratis/pro Cloudflare membatasi body request 100 MB.
    client_max_body_size 55m;
    client_body_timeout  120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil build Vite bernama hash -> aman di-cache lama.
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Hanya index.php yang boleh dieksekusi; file .php lain -> 404.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS           $fwd_https;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ { return 404; }

    # Sembunyikan dotfile (.env, .git), kecuali .well-known.
    location ~ /\.(?!well-known) { deny all; }
}
